name: Offline tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r bilibili-ai-bot/requirements-server.txt
      - run: python -m unittest discover -s tests -p 'test_*.py'
        working-directory: bilibili-ai-bot
      - run: bash -n deploy/deploy.sh && bash -n deploy/rollback.sh
